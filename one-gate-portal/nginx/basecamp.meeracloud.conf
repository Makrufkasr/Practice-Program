# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR ECOSYSTEM INTELLIGENCE
# Domain Target: basecamp.meeracloud / basecamp.meeracloud.id / basecamp.meeracloud.com
# ==============================================================================

# Rate Limiting Zones (Proteksi Login & Registrasi dari Brute Force)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Upstream Backend Services
upstream one_gate_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ==============================================================================
# SERVER 1: HTTP -> HTTPS REDIRECT
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name basecamp.meeracloud basecamp.meeracloud.id basecamp.meeracloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER 2: MAIN PORTAL (basecamp.meeracloud) — HTTPS SSL
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name basecamp.meeracloud basecamp.meeracloud.id basecamp.meeracloud.com;

    # SSL Certificate (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/basecamp.meeracloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basecamp.meeracloud/privkey.pem;

    # SSL Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 50M;

    # Static Assets Caching
    location /static/ {
        proxy_pass http://one_gate_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Auth Rate Limiting (/api/auth/login & /api/auth/register)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://one_gate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://one_gate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Portal Frontend
    location / {
        proxy_pass http://one_gate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
